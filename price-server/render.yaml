services:
  - type: web
    name: portfolio-price-server
    runtime: python
    plan: free
    rootDir: price-server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
